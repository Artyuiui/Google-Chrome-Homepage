<!doctype html>
<html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>หน้าแรก</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#202124;font:14px Arial,sans-serif}a{color:inherit;text-decoration:none}a:hover{text-decoration:underline}nav{display:flex;justify-content:flex-end;gap:24px;padding:24px 30px}main{padding-top:70px;text-align:center}.logo{font:92px Arial,sans-serif;letter-spacing:-7px;margin:0 0 48px;font-weight:500}.logo span:nth-child(1),.logo span:nth-child(4){color:#4285f4}.logo span:nth-child(2),.logo span:nth-child(6){color:#ea4335}.logo span:nth-child(3){color:#fbbc05}.logo span:nth-child(5){color:#34a853}form.search{max-width:746px;margin:auto;display:flex;align-items:center;border:1px solid #eee;border-radius:36px;box-shadow:0 1px 6px #0003;padding:9px 12px 9px 24px;gap:16px;height:58px}input{font:16px Arial,sans-serif}#query{border:0;outline:none;flex:1;min-width:0}.search button,.ai{border:0;background:#f5f6f7;border-radius:25px;padding:12px 15px;font-size:14px;white-space:nowrap;cursor:pointer}.shortcuts{display:flex;justify-content:center;flex-wrap:wrap;max-width:700px;margin:28px auto}.tile{position:relative;width:112px;min-height:114px;border-radius:5px}.tile:hover{background:#f5f6f7}.tile>a,.add{display:flex;align-items:center;flex-direction:column;gap:16px;padding:16px 8px;width:100%;border:0;background:none;font:14px Arial;cursor:pointer;text-decoration:none}.icon{display:grid;place-items:center;background:#edf2fa;width:48px;height:48px;border-radius:50%;font-size:25px;color:#174ea6}.label{max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.edit{position:absolute;right:2px;top:0;border:0;background:none;cursor:pointer;font-size:20px;opacity:0}.tile:hover .edit,.edit:focus{opacity:1}.customize{position:fixed;right:18px;bottom:18px;border:0;background:#d3e3fd;border-radius:24px;padding:12px 18px;color:#174ea6;cursor:pointer}dialog{border:0;border-radius:14px;box-shadow:0 8px 36px #0003;width:350px;padding:26px}dialog::backdrop{background:#0004}dialog h2{margin-top:0;font-size:20px}dialog label{display:block;margin:16px 0 6px}dialog input{width:100%;padding:10px;border:1px solid #dadce0;border-radius:5px}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:24px}.actions button{padding:9px 14px;border:0;border-radius:6px;cursor:pointer}.primary{background:#1a73e8;color:#fff}#error{color:#b3261e} @media(max-width:650px){main{padding:55px 20px 70px}.logo{font-size:76px}.ai{display:none}}

.search-wrap{position:relative;max-width:746px;margin:auto}.suggestions{position:absolute;top:64px;left:0;right:0;z-index:10;background:#fff;border:1px solid #eee;border-radius:18px;box-shadow:0 6px 18px #0002;padding:8px 0;text-align:left;overflow:hidden}.suggestions[hidden]{display:none}.suggestion{padding:12px 22px;font-size:16px;cursor:pointer;display:flex;gap:16px;align-items:center}.suggestion:hover,.suggestion[aria-selected="true"]{background:#eef3fc}.suggestion::before{content:'⌕';color:#70757a}.suggest-note{font-size:12px;color:#70757a;padding:8px 22px;border-top:1px solid #f1f3f4}
</style>
<link rel="stylesheet" href="enhancements.css">
<nav><a href="https://mail.google.com/">Gmail</a><a href="https://www.google.com/imghp">Images</a><button id="apps-toggle" class="icon-button" aria-label="แอป Google" aria-expanded="false" aria-controls="apps-panel"></button><a class="account" href="https://myaccount.google.com/" aria-label="บัญชี Google">G</a></nav>
<main><h1 class="logo" aria-label="Google"><span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span></h1>
<div class="search-wrap"><form class="search" action="https://www.google.com/search"><button type="button" id="attach" class="icon-button" aria-label="ค้นหาด้วยรูปภาพ"></button><input id="query" name="q" placeholder="ค้นหาใน Google" aria-label="ค้นหาใน Google" role="combobox" aria-autocomplete="list" aria-controls="suggestions-list" aria-expanded="false" autocomplete="off" autofocus><button type="button" id="voice" class="icon-button" aria-label="ค้นหาด้วยเสียง"></button><a id="lens" class="icon-button" href="https://lens.google/" aria-label="Google Lens"></a><button type="button" class="ai" id="ai-mode">AI Mode</button></form><div class="suggestions" id="suggestions-panel" hidden><div id="suggestions-list" role="listbox" aria-label="คำค้นแนะนำ"></div><div class="suggest-note">คำแนะนำจาก Google</div></div></div>
<section class="shortcuts" id="shortcuts" aria-label="ทางลัด"></section></main>
<button class="customize" id="customize">ปรับแต่งหน้าแรก</button>
<dialog id="editor"><form id="shortcutForm"><h2 id="heading">เพิ่มทางลัด</h2><label for="name">ชื่อ</label><input id="name" required maxlength="40"><label for="url">URL เว็บไซต์</label><input id="url" required placeholder="https://example.com"><p id="error" role="alert"></p><div class="actions"><button type="button" id="remove">ลบ</button><button type="button" id="cancel">ยกเลิก</button><button class="primary" type="submit">บันทึก</button></div></form></dialog>
<script src="localization.js"></script>
<script>
const key='brave-home-shortcuts-v1',defaults=[{name:'ร้านค้าบนเว็บ',url:'https://chromewebstore.google.com/'},{name:'fb',url:'https://www.facebook.com/'}];let items;try{items=JSON.parse(localStorage.getItem(key))||defaults}catch{items=defaults}if(!Array.isArray(items))items=defaults;
const list=document.querySelector('#shortcuts'),dialog=document.querySelector('#editor'),nameInput=document.querySelector('#name'),urlInput=document.querySelector('#url');let editing=-1;
function safeUrl(value){const u=new URL(/^https?:\/\//i.test(value)?value:'https://'+value);if(!['https:','http:'].includes(u.protocol)||!u.hostname.includes('.'))throw Error();return u.href}
function save(){try{localStorage.setItem(key,JSON.stringify(items))}catch{document.querySelector('#error').textContent=t('บันทึกไม่ได้ โปรดตรวจการอนุญาตพื้นที่จัดเก็บ');return false}render();return true}
function openEditor(i=-1){editing=i;nameInput.value=i<0?'':items[i].name;urlInput.value=i<0?'':items[i].url;document.querySelector('#heading').textContent=i<0?t('เพิ่มทางลัด'):t('แก้ไขทางลัด');document.querySelector('#remove').hidden=i<0;document.querySelector('#error').textContent='';dialog.showModal();nameInput.focus()}
function render(){list.replaceChildren();items.forEach((item,i)=>{let href;try{href=safeUrl(item.url)}catch{return}const tile=document.createElement('div');tile.className='tile';const a=document.createElement('a');a.href=href;const icon=document.createElement('span');icon.className='icon';icon.textContent=new URL(href).hostname.includes('facebook.com')?'f':item.name.slice(0,1).toUpperCase();const label=document.createElement('span');label.className='label';label.textContent=item.name;a.append(icon,label);const edit=document.createElement('button');edit.className='edit';edit.textContent='⋮';edit.setAttribute('aria-label',t('แก้ไข')+' '+item.name);edit.onclick=()=>openEditor(i);tile.append(a,edit);list.append(tile)});const tile=document.createElement('div');tile.className='tile';const add=document.createElement('button');add.className='add';add.innerHTML='<span class="icon">+</span><span>'+t('เพิ่มทางลัด')+'</span>';add.onclick=()=>openEditor();tile.append(add);list.append(tile)}
document.querySelector('#shortcutForm').onsubmit=e=>{e.preventDefault();let url;try{url=safeUrl(urlInput.value.trim())}catch{document.querySelector('#error').textContent=t('กรุณาใส่ URL เว็บไซต์ที่ถูกต้อง');return}const name=nameInput.value.trim();if(!name)return;const item={name,url};if(editing<0)items.push(item);else items[editing]=item;if(save())dialog.close()};document.querySelector('#cancel').onclick=()=>dialog.close();document.querySelector('#remove').onclick=()=>{items.splice(editing,1);if(save())dialog.close()};render();

const query=document.querySelector('#query'),searchForm=document.querySelector('.search'),panel=document.querySelector('#suggestions-panel'),suggestList=document.querySelector('#suggestions-list');
let suggestions=[],active=-1,typed='',timer,request=0,composing=false;
function hideSuggestions(){panel.hidden=true;query.setAttribute('aria-expanded','false');query.removeAttribute('aria-activedescendant');active=-1}
function showSuggestions(values){suggestions=values;suggestList.replaceChildren();active=-1;query.removeAttribute('aria-activedescendant');values.forEach((value,i)=>{const row=document.createElement('div');row.className='suggestion';row.id='suggestion-'+i;row.role='option';row.setAttribute('aria-selected','false');row.textContent=value;row.onmousedown=e=>e.preventDefault();row.onclick=()=>{query.value=value;searchForm.requestSubmit()};suggestList.append(row)});panel.hidden=!values.length;query.setAttribute('aria-expanded',String(!!values.length))}
function loadSuggestions(){const term=query.value.trim();typed=query.value;const id=++request;hideSuggestions();if(!term)return;const script=document.createElement('script'),callback='suggestCallback'+id;let timeout;const cleanup=()=>{clearTimeout(timeout);script.remove();delete window[callback]};window[callback]=data=>{cleanup();if(id!==request||document.activeElement!==query)return;if(Array.isArray(data)&&Array.isArray(data[1]))showSuggestions(data[1].filter(x=>typeof x==='string').slice(0,8))};script.src='https://suggestqueries.google.com/complete/search?client=chrome&hl='+encodeURIComponent(currentLanguage())+'&ie=UTF-8&oe=UTF-8&q='+encodeURIComponent(term)+'&callback='+callback;script.onerror=cleanup;timeout=setTimeout(cleanup,6000);document.head.append(script)}
query.addEventListener('input',()=>{clearTimeout(timer);request++;hideSuggestions();if(!composing)timer=setTimeout(loadSuggestions,180)});
query.addEventListener('compositionstart',()=>{composing=true;clearTimeout(timer)});query.addEventListener('compositionend',()=>{composing=false;clearTimeout(timer);timer=setTimeout(loadSuggestions,180)});
query.addEventListener('focus',()=>{if(query.value.trim())loadSuggestions()});query.addEventListener('keydown',e=>{if(e.isComposing)return;if(e.key==='Escape'){request++;clearTimeout(timer);hideSuggestions();return}if(panel.hidden)return;if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();active=(active+(e.key==='ArrowDown'?1:-1)+suggestions.length)%suggestions.length;[...suggestList.children].forEach((row,i)=>row.setAttribute('aria-selected',String(i===active)));query.value=suggestions[active];query.setAttribute('aria-activedescendant','suggestion-'+active)}});
query.addEventListener('blur',hideSuggestions);searchForm.addEventListener('submit',e=>{if(!query.value.trim())e.preventDefault();clearTimeout(timer);request++;hideSuggestions()});
</script>
<script src="enhancements.js"></script>
<script src="experience.js"></script></html>
